services:
  # --- Web front ---
  nginx:
    image: nginx:latest
    ports:
      - "8081:80"        # ganti ke "80:80" jika port 80 di host bebas
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/var/www/html
    depends_on:
      - php
    restart: unless-stopped

  php:
    image: php:8.2-fpm
    volumes:
      - ./html:/var/www/html
    restart: unless-stopped

  node:
    image: node:26-bookworm
    container_name: webstack-node
    working_dir: /app
    command: ["node", "server.js"]
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
    restart: unless-stopped

  # --- Database / cache ---
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6380:6379"      # host 6379 bisa dipakai Redis bawaan host
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # --- Hermes Agent ---
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    command: gateway run
    ports:
      - "8642:8642"      # gateway API/health (API server default mati)
    volumes:
      - hermes_data:/opt/data
    environment:
      - HERMES_HOME=/opt/data
      # Dashboard opsional (aktifkan + beri auth sebelum dipublikasikan):
      # - HERMES_DASHBOARD=1
      # - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      # - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
    restart: unless-stopped

volumes:
  hermes_data:
  mysql_data:
  redis_data:
  mongo_data:
